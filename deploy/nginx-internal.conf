user nginx;
worker_processes auto;
pid /run/nginx/skinjet.pid;
error_log /var/log/nginx/skinjet-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/skinjet-access.log;
    sendfile on;
    server_tokens off;

    server {
        listen 192.168.130.105:9000;
        server_name ares.szilva13.com skinjetkozmetika.hu;
        root /srv/media/www/skinjetkozmetika/current;
        index index.html;

        allow 192.168.120.0/24;
        deny all;

        add_header X-Content-Type-Options nosniff always;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ /\. {
            deny all;
        }
    }
}